<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Super Music Simulator Experience</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --red: #8B1A1A;
    --red-bright: #c0392b;
    --cream: #e8dcc8;
    --white: #f0ece0;
    --black: #0a0a0a;
    --border-outer: #5a3a3a;
    --border-inner: #3a2a2a;
    --palette-red: #c0392b;
    --palette-mono: #d0cfc8;
    --palette-ice: #8ab4c8;
    --strip-inner-bg: #8B1A1A;
    --strip-outer-text: #6a2a2a;
    --banner-bg: #8B1A1A;
    --banner-text: #f0ece0;
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box; cursor: none !important;
    /* no select / caret */
    user-select: none; -webkit-user-select: none; caret-color: transparent;
  }
  button:focus, [tabindex]:focus { outline: none; }

  /* ===================== CUSTOM CURSOR ===================== */
  #cursor {
    position: fixed; z-index: 10000; pointer-events: none;
    width: 5px; height: 5px;
    outline: 1.5px solid #fff;
    background: rgba(255,255,255,0.15);
    transform: translate(-50%, -50%);
    transition: outline-color 0.05s;
  }
  @media (hover: none) { #cursor { display: none; } }
  #cursor.corrupt {
    outline-color: transparent;
    background: transparent;
  }
  #cursor.corrupt::before, #cursor.corrupt::after {
    content: ''; position: absolute;
    width: 140%; height: 2px; background: #fff;
    top: 50%; left: -20%;
  }
  #cursor.corrupt::before { transform: translateY(-50%) rotate(45deg); }
  #cursor.corrupt::after  { transform: translateY(-50%) rotate(-45deg); }

  body {
    background: #050505;
    color: var(--white);
    font-family: 'Press Start 2P', monospace;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.3;
  }

  /* ===================== APP CONTAINER ===================== */
  #app {
    width: 700px;
    height: 700px;
    position: relative;
    background: var(--black);
    flex-shrink: 0;
  }

  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ===================== SCREEN A: TITLE ===================== */
  #screen-title.active {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .title-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0.35; display: none;
  }

  #title-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center; display: none; pointer-events: none;
  }

  #title-start-prompt {
    position: absolute; bottom: 60px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: var(--white);
    letter-spacing: 6px; pointer-events: none; z-index: 2;
    animation: blink 1.2s step-end infinite;
  }

  .badge-circle {
    width: 300px; height: 300px; border-radius: 50%;
    background: var(--red); border: 6px solid var(--cream);
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 0 10px var(--black), 0 0 0 15px var(--cream), 0 0 50px rgba(139,26,26,0.6);
    animation: badgePulse 3s ease-in-out infinite;
  }

  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 10px var(--black), 0 0 0 15px var(--cream), 0 0 30px rgba(139,26,26,0.4); }
    50%       { box-shadow: 0 0 0 10px var(--black), 0 0 0 15px var(--cream), 0 0 70px rgba(139,26,26,0.8); }
  }

  .badge-arc-text { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
  .badge-center { text-align: center; z-index: 1; }
  .badge-simulator  { font-size: 14px; color: var(--cream); letter-spacing: 2px; line-height: 2; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); }
  .badge-experience { font-size: 12px; color: var(--cream); letter-spacing: 1px; line-height: 2; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); }

  .press-start {
    margin-top: 60px; font-size: 10px; color: var(--cream); letter-spacing: 4px;
    animation: blink 1.2s step-end infinite; position: relative; z-index: 1;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* ===================== SCREEN B: MENU ===================== */
  #screen-menu.active { flex-direction: column; }

  .menu-frame { position: relative; width: 100%; height: 100%; border: 2px solid var(--border-outer); }

  .sb { position: absolute; overflow: hidden; white-space: nowrap; }

  /* Outer English strips */
  .sb-en { font-size: 6px; color: var(--strip-outer-text); letter-spacing: 1px; }
  .sb-en-t { top: 0;    left: 0;  right: 0;  height: 13px; display: flex; align-items: center; }
  .sb-en-b { bottom: 0; left: 0;  right: 0;  height: 13px; display: flex; align-items: center; }
  .sb-en-l { left: 0;   top: 13px; bottom: 13px; width: 13px; writing-mode: vertical-rl; display: flex; align-items: center; }
  .sb-en-r { right: 0;  top: 13px; bottom: 13px; width: 13px; writing-mode: vertical-rl; display: flex; align-items: center; }

  /* Inner border line */
  .inner-line { position: absolute; inset: 13px; border: 1px solid var(--border-inner); pointer-events: none; }

  /* Inner Japanese strips */
  .sb-jp { font-size: 6px; color: var(--black); background: var(--strip-inner-bg); letter-spacing: 1px; }
  .sb-jp-t { top: 14px;    left: 14px;  right: 14px;  height: 12px; display: flex; align-items: center; }
  .sb-jp-b { bottom: 14px; left: 14px;  right: 14px;  height: 12px; display: flex; align-items: center; }
  .sb-jp-l { left: 14px;   top: 26px; bottom: 26px; width: 12px; writing-mode: vertical-rl; display: flex; align-items: center; }
  .sb-jp-r { right: 14px;  top: 26px; bottom: 26px; width: 12px; writing-mode: vertical-rl; display: flex; align-items: center; }

  .st  { animation: scrollH 28s linear infinite; display: inline-block; }
  .stv { animation: scrollV 28s linear infinite; display: inline-block; }
  @keyframes scrollH { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes scrollV { from { transform: translateY(0); } to { transform: translateY(-50%); } }

  /* Content */
  .menu-content {
    position: absolute;
    top: 26px; bottom: 26px; left: 26px; right: 26px;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 12px 10px;
  }
  .menu-content::-webkit-scrollbar { display: none; }

  .menu-title-block { text-align: center; width: 100%; }
  .jp-subtitle { font-size: 6px; color: #aaa; letter-spacing: 2px; margin-bottom: 5px; }
  .dog-blood-banner { background: var(--banner-bg); padding: 8px 18px; display: inline-block; margin-bottom: 4px; }
  .dog-blood-jp { font-size: 18px; color: var(--banner-text); letter-spacing: 4px; }
  .dog-blood-en { font-size: 11px; color: var(--white); letter-spacing: 8px; margin-top: 4px; }

  .section-label { font-size: 6px; color: #888; letter-spacing: 3px; text-align: center; margin-bottom: 7px; }
  .jp-label { font-size: 5px; color: #555; letter-spacing: 2px; display: block; margin-bottom: 3px; }

  .track-select { width: 100%; }
  .track-title  { font-size: 7px; color: var(--cream); letter-spacing: 3px; text-align: center; margin-bottom: 10px; }
  .tracks-grid  { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; justify-items: stretch; }

  /* Track item */
  .track-item {
    font-size: 6px; color: #aaa; padding: 6px 8px; cursor: pointer;
    border: 1px solid transparent; line-height: 1.7; transition: color 0.1s;
    text-align: center;
  }
  .track-item:hover   { color: var(--white); }
  .track-item.selected { background: var(--red); color: var(--white); }
  .track-item.focused  { border-color: var(--cream); }
  .track-jp { font-size: 5px; color: #666; display: block; margin-bottom: 2px; }
  .track-item.selected .track-jp { color: #ddd; }

  /* Corrupted track */
  .track-item.corrupted {
    color: #333;
    cursor: not-allowed;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .track-item.corrupted .track-jp { color: #2a2a2a; }
  .track-item.corrupted:hover {
    animation: glitchCompress 0.12s steps(1) infinite;
    color: #555;
    background: rgba(139,26,26,0.07);
  }
  @keyframes glitchCompress {
    0%   { transform: scaleY(1)    skewX(0deg)   translateX(0);    filter: none; }
    15%  { transform: scaleY(0.1)  skewX(-7deg)  translateX(-4px); filter: brightness(3) hue-rotate(90deg); }
    30%  { transform: scaleY(1.2)  skewX(4deg)   translateX(3px);  filter: brightness(0.4); }
    50%  { transform: scaleY(0.04) skewX(12deg)  translateX(-2px); filter: brightness(5) saturate(0); }
    65%  { transform: scaleY(0.75) skewX(-4deg)  translateX(6px);  filter: hue-rotate(-60deg); }
    80%  { transform: scaleY(0.2)  skewX(6deg)   translateX(-1px); filter: brightness(2); }
    100% { transform: scaleY(1)    skewX(0deg)   translateX(0);    filter: none; }
  }

  .palette-section { width: 100%; text-align: center; }
  .palette-swatches { display: flex; gap: 16px; justify-content: center; margin-top: 8px; align-items: flex-end; }
  .swatch-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .swatch-lbl  { font-size: 5px; color: #555; letter-spacing: 1px; }

  .swatch {
    width: 26px; height: 16px; position: relative;
    border: 2px solid transparent; transition: border-color 0.1s;
  }
  .swatch::before {
    content: '▶'; position: absolute; left: -12px; top: 50%;
    transform: translateY(-50%); font-size: 7px; color: var(--white); display: none;
  }
  .swatch.selected::before { display: block; }
  .swatch.selected { border-color: var(--white); }
  .swatch-red    { background: var(--palette-red); }
  .swatch-mono   { background: var(--palette-mono); }
  .swatch-ice    { background: var(--palette-ice); }
  .swatch-wrap.focused .swatch { border-color: var(--cream); }

  /* Volume */
  .volume-section { width: 100%; text-align: center; }
  .vol-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
  .vol-icon { font-size: 8px; color: #555; }
  #vol-slider {
    -webkit-appearance: none; appearance: none;
    width: 160px; height: 3px; background: #2a1a1a; outline: none; cursor: pointer;
  }
  #vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; background: var(--red-bright); cursor: pointer;
  }
  #vol-slider::-moz-range-thumb {
    width: 10px; height: 10px; background: var(--red-bright); cursor: pointer; border: none;
  }


  .settings-row { width: 100%; display: flex; align-items: stretch; }
  .quality-section, .lang-section { flex: 1; text-align: center; }
  .divider-v { width: 1px; background: #2a1a1a; flex-shrink: 0; }
  .option-row { display: flex; gap: 24px; justify-content: center; margin-top: 8px; }
  .opt-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .opt-jp   { font-size: 5px; color: #555; letter-spacing: 1px; }

  .option-btn {
    font-family: 'Press Start 2P', monospace; font-size: 7px; color: #777; cursor: pointer;
    padding: 5px 10px; border: 1px solid transparent; background: none;
    transition: color 0.1s; letter-spacing: 2px;
  }
  .option-btn:hover    { color: var(--white); }
  .option-btn.selected { color: var(--white); border-color: #555; }
  .option-btn.focused  { color: var(--white); border-color: var(--cream); }

  /* Song parts */
  .part-section { width: 100%; text-align: center; }
  .part-btn.locked       { color: #2e2e2e; cursor: not-allowed; }
  .part-btn.locked:hover { color: #2e2e2e; }
  .opt-wrap.locked .opt-jp { color: #2a2a2a; }
  #waveform { display: block; margin: 12px auto 0; image-rendering: pixelated; }

  .start-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .start-jp   { font-size: 6px; color: #555; letter-spacing: 2px; }
  .start-btn {
    font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--white);
    background: none; border: 1px solid transparent; cursor: pointer; letter-spacing: 6px;
    padding: 10px 28px; animation: startPulse 2s ease-in-out infinite;
  }
  .start-btn:hover   { color: var(--red-bright); }
  .start-btn.focused { color: var(--red-bright); border-color: var(--cream); animation: none; }
  @keyframes startPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

  .divider { width: 100%; height: 1px; background: #2a1a1a; flex-shrink: 0; }

  /* ===================== SCREEN C: PLAYER ===================== */
  /* unused — canvas renders both modes */
  #ascii-display { display: none !important; }

  #hd-canvas {
    position: absolute; inset: 0;
    width: 700px; height: 700px;
    display: none;
    filter: var(--palette-filter, none);
  }

  #player-info {
    position: absolute; bottom: 56px;
    left: 0; right: 0; text-align: center;
    z-index: 10; pointer-events: none;
  }

  .player-track-name {
    font-size: 9px; color: var(--cream); letter-spacing: 4px; text-align: center;
    text-shadow: 0 0 40px rgba(0,0,0,1), 0 0 15px rgba(0,0,0,0.9);
  }
  .player-artist {
    font-size: 6px; color: #888; letter-spacing: 3px; text-align: center; margin-top: 5px;
    text-shadow: 0 0 30px rgba(0,0,0,1);
  }

  .back-btn {
    font-family: 'Press Start 2P', monospace; font-size: 6px; color: #555;
    background: none; border: none; cursor: pointer; letter-spacing: 2px;
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10;
  }
  .back-btn:hover { color: var(--white); }

  .exit-btn {
    font-family: 'Press Start 2P', monospace; font-size: 6px; color: #3a2a2a;
    background: none; border: none; cursor: pointer; letter-spacing: 2px;
    display: block; margin: 4px auto 0;
  }
  .exit-btn:hover { color: #888; }
</style>
</head>
<body>

<div id="app">

  <!-- SCREEN A: TITLE -->
  <div id="screen-title" class="screen active" onclick="titleClick()">
    <video id="title-video" loop playsinline muted crossorigin="anonymous"></video>
    <div id="title-start-prompt">START GAME</div>
  </div>

  <!-- SCREEN B: MENU -->
  <div id="screen-menu" class="screen">
    <div class="menu-frame">

      <!-- Outer strips -->
      <div class="sb sb-en sb-en-t"><span id="sb-en-t" class="st" style="animation-direction:reverse"></span></div>
      <div class="sb sb-en sb-en-b"><span id="sb-en-b" class="st"></span></div>
      <div class="sb sb-en sb-en-l"><span id="sb-en-l" class="stv"></span></div>
      <div class="sb sb-en sb-en-r"><span id="sb-en-r" class="stv" style="animation-direction:reverse"></span></div>

      <!-- Inner border line -->
      <div class="inner-line"></div>

      <!-- Inner strips -->
      <div class="sb sb-jp sb-jp-t"><span id="sb-jp-t" class="st" style="animation-direction:reverse;animation-duration:40s"></span></div>
      <div class="sb sb-jp sb-jp-b"><span id="sb-jp-b" class="st" style="animation-duration:40s"></span></div>
      <div class="sb sb-jp sb-jp-l"><span id="sb-jp-l" class="stv" style="animation-duration:40s"></span></div>
      <div class="sb sb-jp sb-jp-r"><span id="sb-jp-r" class="stv" style="animation-direction:reverse;animation-duration:40s"></span></div>

      <!-- Content -->
      <div class="menu-content">

        <div class="menu-title-block">
          <div class="jp-subtitle" id="menu-subtitle-jp"></div>
          <div class="dog-blood-banner">
            <div class="dog-blood-jp" id="menu-artist-jp"></div>
          </div>
          <div class="dog-blood-en" id="menu-artist-en"></div>
        </div>

        <div class="divider"></div>

        <div class="track-select" style="width:100%">
          <div class="track-title">
            <span class="jp-label" id="track-section-jp"></span>
            <span id="track-section-en"></span>
          </div>
          <div class="tracks-grid" id="tracks-grid"></div>
        </div>

        <div class="divider"></div>

        <div class="part-section">
          <div class="section-label">
            <span class="jp-label" id="part-section-jp"></span>
            <span id="part-section-en"></span>
          </div>
          <div class="option-row" id="parts-row"></div>
          <canvas id="waveform"></canvas>
          <div class="vol-row" style="margin-top:12px">
            <span class="vol-icon">♪</span>
            <input type="range" id="vol-slider" min="0" max="100" value="40" oninput="setVolume(this.value)">
            <span class="vol-icon">♫</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="palette-section">
          <div class="section-label">
            <span class="jp-label" id="palette-section-jp"></span>
            <span id="palette-section-en"></span>
          </div>
          <div class="palette-swatches">
            <div class="swatch-wrap" onclick="selectPalette('red', this)">
              <span class="swatch-lbl" id="swatch-lbl-red"></span>
              <div class="swatch swatch-red selected"></div>
            </div>
            <div class="swatch-wrap" onclick="selectPalette('mono', this)">
              <span class="swatch-lbl" id="swatch-lbl-mono"></span>
              <div class="swatch swatch-mono"></div>
            </div>
            <div class="swatch-wrap" onclick="selectPalette('ice', this)">
              <span class="swatch-lbl" id="swatch-lbl-ice"></span>
              <div class="swatch swatch-ice"></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="settings-row">
        <div class="quality-section">
          <div class="section-label">
            <span class="jp-label" id="quality-section-jp"></span>
            <span id="quality-section-en"></span>
          </div>
          <div class="option-row">
            <div class="opt-wrap">
              <span class="opt-jp" id="quality-opt1-jp"></span>
              <button class="option-btn selected" onclick="selectOption(this, 'quality')" id="quality-opt1-en"></button>
            </div>
            <div class="opt-wrap">
              <span class="opt-jp" id="quality-opt2-jp"></span>
              <button class="option-btn" onclick="selectOption(this, 'quality')" id="quality-opt2-en"></button>
            </div>
          </div>
        </div>

        <div class="divider-v"></div>

        <div class="lang-section">
          <div class="section-label">
            <span class="jp-label" id="lang-section-jp"></span>
            <span id="lang-section-en"></span>
          </div>
          <div class="option-row">
            <div class="opt-wrap">
              <span class="opt-jp" id="lang-opt1-jp"></span>
              <button class="option-btn selected" onclick="selectOption(this, 'language')" id="lang-opt1-en"></button>
            </div>
            <div class="opt-wrap">
              <span class="opt-jp" id="lang-opt2-jp"></span>
              <button class="option-btn" onclick="selectOption(this, 'language')" id="lang-opt2-en"></button>
            </div>
          </div>
        </div>
        </div>

        <div class="divider"></div>

        <div class="start-wrap">
          <span class="start-jp" id="start-jp"></span>
          <button class="start-btn" onclick="goToPlayer()" id="start-en"></button>
          <button class="exit-btn" onclick="goToTitle()">← EXIT</button>
        </div>

      </div>
    </div>
  </div>

  <!-- video source -->
  <video id="bg-video" loop playsinline muted crossorigin="anonymous" style="display:none"></video>

  <!-- SCREEN C: PLAYER -->
  <div id="screen-player" class="screen">
    <pre id="ascii-display"></pre>
    <canvas id="hd-canvas" width="700" height="700"></canvas>
    <div id="player-info">
      <div class="player-track-name" id="playerTrackName"></div>
      <div class="player-artist"     id="playerArtist"></div>
    </div>
    <button class="back-btn" id="back-btn" onclick="playSound('back'); goToMenu()"></button>
  </div>

</div>
<div id="cursor"></div>

<script>
// =============================================================
//  CONFIG
// =============================================================

// Max scale — shrinks to fit screen
const APP_SCALE = 1.25;

const TITLE_SCREEN_IMAGE = '';

// Title video
const TITLE_VIDEO_URL = 'https://res.cloudinary.com/killbenny/video/upload/v1775061457/gameloop.mp4';

// Player video
const VIDEO_URL = 'https://res.cloudinary.com/killbenny/video/upload/v1774896516/Crazy_Manet_Test9.mp4';

const TEXT = {
  pageTitle:   'super music simulator experience!!',

  arcTop:      '//title',
  arcBottom:   '\\(*·ω·)/ ',
  badgeLine1:  '//artist',
  badgeLine2:  '2021',
  pressStart:  'PRESS START',

  scrollEn:    '//artist — //project',
  scrollJp:    '//アーティスト — //プロジェクト',

  subtitleJp:  '「//プロジェクト」',
  artistJp:    '//アーティスト',
  artistEn:    '//ARTIST - //PROJECT',

  trackSectionJp: 'トラックを選択',
  trackSectionEn: 'SELECT TRACK',

  partSectionJp: 'パートを選択',
  partSectionEn: 'SELECT PART',

  paletteSectionJp: 'カラーパレット',

// ===================== AUDIO =====================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

function setVolume(val) {
  masterVolume = val / 100;
}

function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  const ctx = audioCtx, now = ctx.currentTime;
  const v = masterVolume * 0.08; // max peak gain

  if (type === 'confirm') {
    [330, 440, 550, 660].forEach((freq, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.connect(g); g.connect(ctx.destination);
      const t = now + i * 0.07;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.start(t); o.stop(t + 0.12);
    });
    return;
  }

  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'square'; osc.connect(gain); gain.connect(ctx.destination);

  if (type === 'navigate') {
    osc.frequency.setValueAtTime(220, now);
    gain.gain.setValueAtTime(v, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'select') {
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(660, now + 0.05);
    gain.gain.setValueAtTime(v, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
    osc.start(now); osc.stop(now + 0.14);
  } else if (type === 'back') {
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(220, now + 0.06);
    gain.gain.setValueAtTime(v, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
    osc.start(now); osc.stop(now + 0.14);
  }
}

// ===================== KEYBOARD NAVIGATION =====================
const NUM_GROUPS = 6;
let menuFocusGroup = -1;
let menuFocusIndex = 0;

function clearFocus() { document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused')); }

function getGroupItems(g) {
  if (g === 0) return [...document.querySelectorAll('.track-item:not(.corrupted)')];
  if (g === 1) return [...document.querySelectorAll('.part-btn:not(.locked)')];
  if (g === 2) return [...document.querySelectorAll('.swatch-wrap')];
  if (g === 3) return [...document.querySelectorAll('.quality-section .option-btn')];
  if (g === 4) return [...document.querySelectorAll('.lang-section .option-btn')];
  if (g === 5) return [document.querySelector('.start-btn')];
  return [];
}

function applyFocus() {
  if (menuFocusGroup < 0) return;
  const items = getGroupItems(menuFocusGroup);
  if (!items.length) return;
  menuFocusIndex = Math.max(0, Math.min(menuFocusIndex, items.length - 1));
  const el = items[menuFocusIndex];
  el.classList.add('focused');
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

document.addEventListener('keydown', e => {
  const active = document.querySelector('.screen.active');
  if (!active) return;

  if (active.id === 'screen-title') {
    if (['Enter',' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault(); titleClick();
    }
    return;
  }

  if (active.id === 'screen-menu') {
    if (e.key === 'Escape') { e.preventDefault(); playSound('back'); goToTitle(); return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault(); clearFocus();
      menuFocusGroup = menuFocusGroup < 0 ? 0 : (menuFocusGroup + 1) % NUM_GROUPS;
      menuFocusIndex = 0; playSound('navigate'); applyFocus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); clearFocus();
      menuFocusGroup = menuFocusGroup < 0 ? NUM_GROUPS-1 : (menuFocusGroup - 1 + NUM_GROUPS) % NUM_GROUPS;
      menuFocusIndex = 0; playSound('navigate'); applyFocus();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault(); if (menuFocusGroup < 0) return;
      const items = getGroupItems(menuFocusGroup); clearFocus();
      menuFocusIndex = (menuFocusIndex + 1) % items.length; playSound('navigate'); applyFocus();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault(); if (menuFocusGroup < 0) return;
      const items = getGroupItems(menuFocusGroup); clearFocus();
      menuFocusIndex = (menuFocusIndex - 1 + items.length) % items.length; playSound('navigate'); applyFocus();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault(); if (menuFocusGroup < 0) return;
      getGroupItems(menuFocusGroup)[menuFocusIndex]?.click();
    }
    return;
  }

  if (active.id === 'screen-player') {
    if (e.key === 'Escape') { e.preventDefault(); playSound('back'); goToMenu(); }
  }
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===================== CORRUPTED GLITCH =====================
function startCorruptedGlitch() {
  stopCorruptedGlitch();
  document.querySelectorAll('.track-item.corrupted').forEach(el => {
    const jpEl = el.querySelector('.track-jp');
    const origJp = jpEl.textContent;
    const textNode = [...el.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
    const origEn = textNode ? textNode.textContent : '';
    function glitchStr(str) {
      return str.split('').map(c =>
        c.trim() === '' ? c : (Math.random() < 0.3
          ? GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)] : c)
      ).join('');
    }
    const id = setInterval(() => {
      jpEl.textContent = glitchStr(origJp);
      if (textNode) textNode.textContent = glitchStr(origEn);
    }, 130);
    corruptIntervals.push(id);
  });
}

function stopCorruptedGlitch() {
  corruptIntervals.forEach(clearInterval);
  corruptIntervals = [];
}

// ===================== WAVEFORM =====================
const WAVE_COLS = 20;  // bars
const WAVE_HALF = 4;   // half height (blocks)
const WAVE_PIX  = 2;   // block size
const WAVE_GAP  = 1;   // bar gap
let waveHeights = [];
let waveStart = 0;

// Envelopes, t = 0..1
const WAVE_SHAPES = {
  build: t => 0.15 + 0.85 * t * t,
  drop:  t => 0.8 + 0.2 * Math.sin(t * Math.PI * 8),
  fade:  t => 1 - 0.85 * t,
};

// Seeded per track/part
function waveData(seed, shape) {
  const envFn = WAVE_SHAPES[shape] || (t => 0.35 + 0.65 * Math.sin(Math.PI * t));
  let s = seed >>> 0;
  const rand = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return Array.from({ length: WAVE_COLS }, (_, i) => {
    const env = envFn((i + 0.5) / WAVE_COLS);
    return Math.max(0, Math.round(env * (0.3 + 0.7 * rand()) * WAVE_HALF));
  });
}

function resetWaveform() {
  waveHeights = waveData(selectedTrack * 31 + selectedPart * 7 + 1, parts[selectedPart]?.shape);
  waveStart = performance.now();
}

function initWaveform() {
  const c = document.getElementById('waveform');
  c.width  = WAVE_COLS * (WAVE_PIX + WAVE_GAP) - WAVE_GAP;
  c.height = (WAVE_HALF * 2 + 1) * WAVE_PIX;
  resetWaveform();
  requestAnimationFrame(renderWaveform);
}

function renderWaveform(now) {
  requestAnimationFrame(renderWaveform);
  if (!document.getElementById('screen-menu').classList.contains('active')) return;

  const c = document.getElementById('waveform');
  const ctx = c.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const played   = css.getPropertyValue('--red-bright').trim();
  const unplayed = css.getPropertyValue('--border-inner').trim();
  const head     = css.getPropertyValue('--cream').trim();

  const progress = ((now - waveStart) % WAVE_LOOP_MS) / WAVE_LOOP_MS;
  const headX = Math.floor(progress * c.width);

  ctx.clearRect(0, 0, c.width, c.height);
  waveHeights.forEach((h, i) => {
    const x = i * (WAVE_PIX + WAVE_GAP);
    ctx.fillStyle = x + WAVE_PIX <= headX ? played : unplayed;
    ctx.fillRect(x, (WAVE_HALF - h) * WAVE_PIX, WAVE_PIX, (h * 2 + 1) * WAVE_PIX);
  });

  ctx.fillStyle = head;
  ctx.fillRect(headX, 0, 1, c.height);
}

// Cover-fit video into ctx
function drawVideoCover(ctx, video, w, h) {
  ctx.fillStyle = '#010101';
  ctx.fillRect(0, 0, w, h);
  if (video.readyState >= 2 && video.videoWidth > 0) {
    const scale = Math.max(w / video.videoWidth, h / video.videoHeight);
    const dw = video.videoWidth * scale, dh = video.videoHeight * scale;
    ctx.drawImage(video, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }
}

// ===================== HD — video + heavy cursor glitch =====================
function renderHD() {
  const canvas = document.getElementById('hd-canvas');
  if (!canvas || canvas.style.display === 'none') return;
  const ctx   = canvas.getContext('2d');
  const bctx  = hdBuffer.getContext('2d');
  const video = document.getElementById('bg-video');

  // 1. Video → buffer
  drawVideoCover(bctx, video, 700, 700);

  // 2. Cursor in canvas space
  const appRect = document.getElementById('app').getBoundingClientRect();
  const cx = (cursorX - appRect.left) / appScale;
  const cy = (cursorY - appRect.top)  / appScale;
  const inZone = cx >= 0 && cx <= 700 && cy >= 0 && cy <= 700;

  if (!inZone) {
    ctx.drawImage(hdBuffer, 0, 0);
    playerAnimId = requestAnimationFrame(renderHD);
    return;
  }

  const RADIUS = 40;
  const zTop = Math.max(0,   cy - RADIUS);
  const zBot = Math.min(700, cy + RADIUS);

  // 3. Clean video outside zone
  ctx.fillStyle = '#010101';
  ctx.fillRect(0, 0, 700, 700);
  if (zTop > 0)
    ctx.drawImage(hdBuffer, 0, 0,    700, zTop,        0, 0,    700, zTop);
  if (zBot < 700)
    ctx.drawImage(hdBuffer, 0, zBot, 700, 700 - zBot,  0, zBot, 700, 700 - zBot);

  // 4. Black zone
  ctx.fillStyle = '#010101';
  ctx.fillRect(0, zTop, 700, zBot - zTop);

  // 5. Compressed strips
  const numStrips = 3 + Math.floor(Math.random() * 4);
  for (let s = 0; s < numStrips; s++) {
    const srcY  = zTop + Math.random() * (zBot - zTop);
    const srcH  = 1 + Math.random() * 10;
    const compY = 0.05 + Math.random() * 0.45;
    const destH = Math.max(0.5, srcH * compY);
    const destY = zTop + Math.random() * (zBot - zTop - destH);
    const offX  = (Math.random() - 0.5) * 30;
    ctx.drawImage(hdBuffer, 0, srcY, 700, Math.max(1, srcH), offX, destY, 700, destH);
  }

  // 6. Chroma slice
  if (Math.random() > 0.5) {
    const sliceY    = zTop + Math.random() * (zBot - zTop);
    const sliceH    = 1 + Math.random() * 6;
    const shiftAmt  = 6 + Math.random() * 16;
    ctx.drawImage(hdBuffer, 0, sliceY, 700, Math.max(1, sliceH),
                 -shiftAmt, sliceY, 700, sliceH);
  }

  // 7. Scanlines
  for (let f = 0; f < 1 + Math.floor(Math.random() * 2); f++) {
    const fy = zTop + Math.random() * (zBot - zTop);
    ctx.fillStyle = `rgba(255,255,255,${(Math.random() * 0.18).toFixed(3)})`;
    ctx.fillRect(0, fy, 700, 1);
  }

  playerAnimId = requestAnimationFrame(renderHD);
}

// ===================== NGBC — ASCII rendered onto canvas =====================
function initAsciiSampler() {
  const FONT_SIZE = 7;
  asciiCharH = FONT_SIZE * 1.18; // line height
  asciiFont  = `${Math.round(asciiCharH)}px "Courier New", Courier, monospace`;

  const canvas = document.getElementById('hd-canvas');
  const ctx    = canvas.getContext('2d');
  ctx.font     = asciiFont;
  asciiCharW   = ctx.measureText('M').width;

  asciiCols = Math.ceil(700 / asciiCharW);
  asciiRows = Math.ceil(700 / asciiCharH);
  // centre grid
  asciiOffX = (700 - asciiCols * asciiCharW) / 2;
  asciiOffY = (700 - asciiRows * asciiCharH) / 2;

  // Sample canvas at grid res
  sampleCanvas        = document.createElement('canvas');
  sampleCanvas.width  = asciiCols;
  sampleCanvas.height = asciiRows;
  sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
}

function renderAscii() {
  const canvas = document.getElementById('hd-canvas');
  if (!canvas || canvas.style.display === 'none') return;

  const ctx   = canvas.getContext('2d');
  const video = document.getElementById('bg-video');

  const bright = getComputedStyle(document.documentElement)
                   .getPropertyValue('--red-bright').trim() || '#c0392b';

  // Sample
  let pixelData = null;
  if (video.readyState >= 2 && video.videoWidth > 0) {
    // cover-fit in px space, squash to grid
    const gridW = asciiCols * asciiCharW, gridH = asciiRows * asciiCharH;
    sampleCtx.setTransform(asciiCols / gridW, 0, 0, asciiRows / gridH, 0, 0);
    drawVideoCover(sampleCtx, video, gridW, gridH);
    sampleCtx.setTransform(1, 0, 0, 1, 0, 0);
    try {
      pixelData = sampleCtx.getImageData(0, 0, asciiCols, asciiRows).data;
    } catch (_) { pixelData = null; }
  }

  // Build grid
  const lines = [];
  for (let r = 0; r < asciiRows; r++) {
    let line = '';
    for (let c = 0; c < asciiCols; c++) {
      let idx = 0;
      if (pixelData) {
        const i    = (r * asciiCols + c) * 4;
        const luma = 0.299 * pixelData[i] + 0.587 * pixelData[i+1] + 0.114 * pixelData[i+2];
        idx = Math.min(ASCII_RAMP.length - 1, Math.floor(luma / 255 * ASCII_RAMP.length));
      }
      line += ASCII_RAMP[idx];
    }
    lines.push(line);
  }

  // Render
  ctx.fillStyle = '#010101';
  ctx.fillRect(0, 0, 700, 700);
  ctx.font         = asciiFont;
  ctx.fillStyle    = bright;
  ctx.textBaseline = 'top';

  for (let r = 0; r < asciiRows; r++) {
    ctx.fillText(lines[r], asciiOffX, asciiOffY + r * asciiCharH);
  }

  playerAnimId = requestAnimationFrame(renderAscii);
}

// ===================== FIT TO SCREEN =====================
function fitApp() {
  const vw = window.visualViewport?.width  || window.innerWidth;
  const vh = window.visualViewport?.height || window.innerHeight;
  appScale = Math.min(APP_SCALE, vw / 700, vh / 700);
  document.getElementById('app').style.transform = `scale(${appScale})`;
}

// ===================== INIT =====================
(function init() {
  // Cursor
  document.addEventListener('mousemove', e => {
    cursorX = e.clientX; cursorY = e.clientY;
    const cur = document.getElementById('cursor');
    cur.style.left = cursorX + 'px';
    cur.style.top  = cursorY + 'px';
  });
  document.addEventListener('mouseover', e => {
    const isCorrupt = !!e.target.closest('.track-item.corrupted');
    document.getElementById('cursor').classList.toggle('corrupt', isCorrupt);
  });

  fitApp();
  window.addEventListener('resize', fitApp);

  applyText();
  initWaveform();
  if (TITLE_VIDEO_URL) {
    const tv = document.getElementById('title-video');
    tv.src = TITLE_VIDEO_URL;
    tv.style.display = 'block';
    tv.play().catch(() => {});
  } else if (TITLE_SCREEN_IMAGE) {
    const img = document.getElementById('titleBg');
    img.src = TITLE_SCREEN_IMAGE; img.style.display = 'block';
  }
  if (VIDEO_URL) {
    const video = document.getElementById('bg-video');
    video.src = VIDEO_URL;
    video.load();
  }
})();
</script>
